# Config for scripts/gen-docs-*.sh.

# Base branch to diff against when no [base-branch] argument is given.
# Overrides auto-detection via origin/HEAD.
base_branch=origin/main

# Where docs live, relative to the repo root. Defaults to "docs" if unset.
# This repo's docs live under the vendored tinygrad/ copy, not at the root.
docs_dir=tinygrad/docs

name: Docs consistency check

# Compares the code diff against the docs diff for a PR and leaves a comment
# if they look inconsistent. Never edits or commits anything itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve docs dir
        id: resolve
        run: |
          DOCS_DIR="docs"
          if [ -f tooling.conf ]; then
            configured="$(grep -E '^docs_dir=' tooling.conf | tail -1 | cut -d= -f2-)"
            [ -n "$configured" ] && DOCS_DIR="$configured"
          fi
          echo "docs_dir=$DOCS_DIR" >> "$GITHUB_OUTPUT"

      - name: Build diffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_DIR: ${{ steps.resolve.outputs.docs_dir }}
        run: |
          git diff "$BASE_SHA...$HEAD_SHA" -- . ":(exclude)$DOCS_DIR/**" > code.diff
          git diff "$BASE_SHA...$HEAD_SHA" -- "$DOCS_DIR/" > docs.diff

      - name: Run Copilot check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DOCS_DIR: ${{ steps.resolve.outputs.docs_dir }}
        run: |
          copilot -p "You are checking a pull request.
          code.diff contains the code changes. docs.diff contains the changes under $DOCS_DIR.
          Compare them and list any issues:
          - code behaviour changed but the docs were not updated
          - docs describe something that doesn't match the code change
          - renamed/removed params, endpoints, config keys still referenced in $DOCS_DIR
          Be concise. Output markdown. If there are no issues, say 'No documentation issues found.'
          Do not modify any files." \
            --deny-tool 'shell' \
            --deny-tool 'write' \
            --deny-tool 'url' \
            --no-color \
            -s > result.md

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file result.md
